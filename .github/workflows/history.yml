name: Capture public-service history
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observatory-history
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture public APIs
        run: node scripts/capture-history.mjs
      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/history/snapshots.json site/history/bus-details.json site/history/incidents.json site/history/latest.json site/history/timeline.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record public-service snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
